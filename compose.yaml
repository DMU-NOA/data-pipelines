# One long-running pipeline application. Existing PostgreSQL/PostGIS is external.
# Docker volumes survive image and container replacement.
services:
  pipeline:
    build: .
    image: noa-data-pipeline:dev
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: ${DB_HOST:?DB_HOST must be reachable from Docker}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-noa}
      DB_USER: ${DB_USER:-noa}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - noa_raw:/app/data/raw
      - noa_models:/app/artifacts
    # Secrets are supplied only at runtime.
volumes:
  noa_raw:
  noa_models:
